name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Desktop app version for this build"
        required: true
        default: "1.0.4"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install app dependencies and PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip Pillow pypdf keyring pyinstaller

      - name: Set release version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.app_version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = $env:MANUAL_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must use major.minor.patch format" }
          $env:APP_VERSION = $version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $source = Get-Content coolscaner.py -Raw
          $source = $source -replace 'DESKTOP_APP_VERSION = "[^"]+"', "DESKTOP_APP_VERSION = `"$version`""
          Set-Content coolscaner.py -Value $source -NoNewline -Encoding utf8

      - name: Build Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name EquipmentCheckIn `
            --distpath dist\windows `
            --workpath build\windows `
            --hidden-import pypdf `
            --hidden-import keyring.backends.Windows `
            coolscaner.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\windows.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EquipmentCheckIn-Windows-Installer
          path: dist/windows-installer/EquipmentCheckIn-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$env:APP_VERSION"
          }
          gh release create $tag dist\windows-installer\EquipmentCheckIn-Setup.exe --title "Equipment Check-In $tag" --generate-notes
