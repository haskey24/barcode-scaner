databases:
  - name: equipment-ledger-db
    plan: basic-256mb
    databaseName: equipment_ledger
    user: equipment_ledger

services:
  - type: web
    name: equipment-ledger
    runtime: python
    plan: starter
    rootDir: web_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equipment-ledger-db
          property: connectionString
      - key: TOKEN_DAYS
        value: "30"
